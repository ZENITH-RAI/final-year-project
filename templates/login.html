{% extends "base.html" %}

{% block title %}Login — AutoValue{% endblock %}
{% block description %}Log in to AutoValue to view your profile and estimate history.{% endblock %}

{% block content %}
<div class="wrap auth-page">
  <section class="auth-shell auth-shell--single" aria-labelledby="login-title">
    <div class="auth-panel auth-panel--accent auth-panel--compact">
      <h1 id="login-title">Log in</h1>
      <form class="auth-form" action="{{ url_for('login', next=next_url) }}" method="post" data-auth-form="login" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        {% if error %}
        <p class="form-message form-message--error" role="alert">{{ error }}</p>
        {% endif %}
        <div class="field" data-field="email">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            value="{{ form_data.get('email', '') }}"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <span class="field__error" role="alert"></span>
        </div>
        <div class="field" data-field="password">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <span class="field__error" role="alert"></span>
        </div>
        <div class="auth-form__actions">
          <button type="submit" class="btn btn--primary">Log in</button>
        </div>
      </form>
    </div>
  </section>
</div>
{% endblock %}
